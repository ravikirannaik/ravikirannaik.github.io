lumn"},{"attributes":{"source":{"id":"1001","type":"ColumnDataSource"}},"id":"1267","type":"CDSView"},{"attributes":{"align":"center","text":"Goods market","text_color":{"value":"black"},"text_font":"arial","text_font_size":{"value":"12pt"}},"id":"1229","type":"Title"},{"attributes":{"columns":[{"id":"1438","type":"TableColumn"},{"id":"1440","type":"TableColumn"}],"height":150,"index_position":null,"source":{"id":"1006","type":"ColumnDataSource"},"view":{"id":"1447","type":"CDSView"},"width":210},"id":"1446","type":"DataTable"},{"attributes":{"children":[{"id":"1481","type":"Column"},{"id":"1482","type":"Column"}]},"id":"1483","type":"Row"},{"attributes":{"callback":null,"end":2200},"id":"1231","type":"Range1d"},{"attributes":{"source":{"id":"1006","type":"ColumnDataSource"}},"id":"1447","type":"CDSView"},{"attributes":{"children":[{"id":"1483","type":"Row"}]},"id":"1484","type":"Column"},{"attributes":{"callback":null,"end":2000},"id":"1233","type":"Range1d"},{"attributes":{"height":380,"text":"\n&lt;!DOCTYPE html&gt;\n&lt;html&gt;\n&lt;head&gt;\n&lt;title&gt;Page Title&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;img src=\"setup_is_lm.png\" alt=\"IS-LM_model_setup\" height=\"800\"&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n","width":900},"id":"1448","type":"Div"},{"attributes":{"children":[[{"id":"1484","type":"Column"},0,0]]},"id":"1485","type":"GridBox"},{"attributes":{"callback":null,"data":{"C_GGW":[560.0],"G_GGW":[200],"I_GGW":[290.0],"M_GGW":[625],"NX_GGW":[0],"Y_GGW":[1050.0],"i_GGW":[0.055]},"selected":{"id":"1492","type":"Selection"},"selection_policy":{"id":"1493","type":"UnionRenderers"}},"id":"1007","type":"ColumnDataSource"},{"attributes":{},"id":"1235","type":"LinearScale"},{"attributes":{"height":380,"text":"\n&lt;!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"&gt;\n&lt;html xmlns=\"http://www.w3.org/1999/xhtml\"&gt;\n\n&lt;head&gt;\n&lt;meta content=\"de\" http-equiv=\"Content-Language\" /&gt;\n&lt;meta content=\"text/html; charset=utf-8\" http-equiv=\"Content-Type\" /&gt;\n&lt;title&gt;Instructions - How to use the IS&lt;/title&gt;\n&lt;style type=\"text/css\"&gt;\n.auto-style1 {\n\tfont-size: large;\n\tfont-family: Arial, Helvetica, sans-serif;\n\ttext-align: center;\n}\n.auto-style2 {\n\tfont-family: Arial, Helvetica, sans-serif;\n\ttext-align: left;\n}\n.auto-style3 {\n\ttext-decoration: underline;\n\tfont-size: medium;\n}\n.auto-style7 {\n\ttext-align: right;\n}\npre\n\t{margin-bottom:.0001pt;\n\tfont-size:10.0pt;\n\tfont-family:\"Courier New\";\n\tmargin-left: 0cm;\n\tmargin-right: 0cm;\n\tmargin-top: 0cm;\n}\na:link\n\t{color:#0563C1;\n\ttext-decoration:underline;\n\ttext-underline:single;\n}\n.auto-style6 {\n\tfont-family: Arial, Helvetica, sans-serif;\n\ttext-align: left;\n\tfont-size: medium;\n}\n.auto-style8 {\n\ttext-align: right;\n\tfont-size: medium;\n}\n&lt;/style&gt;\n&lt;/head&gt;\n\n&lt;body&gt;\n\n&lt;p class=\"auto-style1\"&gt;&lt;strong&gt;Instructions - How to use the IS-LM-Model program&lt;/strong&gt;&lt;/p&gt;\n&lt;p class=\"auto-style6\"&gt;This program provides a simple way to study the\nintuition of the IS-LM Model. It facilitates an easy understanding of the\nbasic economic concepts and the mechanics of the IS-LM framework. There are three Models which serve as a\n\"playground\" for countrfactual analysis. To distinguish between the Models\nthroughout the user interface, different and unique colors are used for every\nModel.&lt;/p&gt;\n&lt;p class=\"auto-style2\"&gt;&lt;span class=\"auto-style3\"&gt;&lt;strong&gt;Model 1-3 section:&lt;/strong&gt;&lt;/span&gt;&lt;span class=\"auto-style8\"&gt;\nThis section provides the input arguments for\nthe Models&lt;/span&gt;&lt;/p&gt;\n&lt;ul&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;Model 1:&lt;/span&gt;&lt;/strong&gt;&lt;span class=\"auto-style8\"&gt; Choose parameter values\n\tfor Model 1. This serves as the starting point (initial equilibrium) for the\n\tcounterfactual analysis. Press the button \"default values\" if you wish to\n\trestore the default equilibrium.&lt;/span&gt;&lt;/li&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;Model 2:&lt;/span&gt;&lt;/strong&gt;&lt;span class=\"auto-style8\"&gt; Choose parameter values\n\tfor the Model 2. To get the same initial equilibrium as in Model 1 (starting\n\tpoint of counterfactual analysis), press the button \"assign values of Model\n\t1\". Now, you can induce an exogenous shock to the model equilibrium by\n\tchoosing parameter values appropriately. For example, change the value of\n\t&lt;/span&gt;\n\t&lt;em&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;G&lt;/span&gt;&lt;/strong&gt;&lt;/em&gt;&lt;span class=\"auto-style8\"&gt; to study\n\tthe Model's response to a government spending shock. &lt;/span&gt; &lt;/li&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;Model 3:&lt;/span&gt;&lt;/strong&gt;&lt;span class=\"auto-style8\"&gt; Choose parameter values\n\tfor the Model 3. To get the same initial equilibrium as in Model 2 (after\n\texogenous shock), press the button \"assign values of Model 2\". Now, you can\n\tstudy the response of monetary policy by changing the Model's parameters\n\tappropriately.&amp;nbsp; For example, change the value of&amp;nbsp;&lt;/span&gt;&lt;strong&gt;&lt;em&gt;&lt;span class=\"auto-style8\"&gt;M&lt;/span&gt;&lt;/em&gt;&lt;/strong&gt;&lt;span class=\"auto-style8\"&gt; to study the\n\tModel's response to a increase of money supply by the centreal bank.\n\tHowever, if you wish to study the effects of interest rate control policy\n\tinstead, choose interest rate directly. &lt;/span&gt; &lt;/li&gt;\n&lt;/ul&gt;\n&lt;p class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style3\"&gt;Results:&lt;/span&gt;&lt;/strong&gt;&lt;span class=\"auto-style8\"&gt;\nThis section provides the results of\nthe Models (chosen parameter constellations)&lt;/span&gt;&lt;/p&gt;\n&lt;ul&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;Equilibrium values:&lt;/span&gt;&lt;/strong&gt;&lt;span class=\"auto-style8\"&gt; This section\n\tprovides the numerical results (equilibrium values) of the macroeconomic\n\tequilibrium, respectively.&lt;/span&gt;&lt;/li&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;IS-LM: &lt;/span&gt; &lt;/strong&gt;\n\t&lt;span class=\"auto-style8\"&gt;This graph shows the plots\n\tof the IS and the LM curve. The intersection of both is the macroeconomic\n\tequilibrium of the Model. To see the plots for Model 2 and 3 press the\n\tgreyed fields named \"Model 2\" and \"Model 3\".&lt;/span&gt;&lt;/li&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;Money market:\n\t&lt;/span&gt; &lt;/strong&gt;&lt;span class=\"auto-style8\"&gt;This graph shows the\n\tplots of the money demand and the money supply curve. The intersection of\n\tboth constitutes the money market equilibrium. To see the plots for Model 2\n\tand 3 press the greyed fields named \"Model 2\" and \"Model 3\".&lt;/span&gt;&lt;/li&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;Money market:\n\t&lt;/span&gt; &lt;/strong&gt;&lt;span class=\"auto-style8\"&gt;This graph shows the\n\tplots of the money demand and the money supply curve. The intersection of\n\tboth curves constitutes the money market equilibrium. To see the plots for\n\tModel 2 and 3 press the greyed fields named \"Model 2\" and \"Model 3\".&lt;/span&gt;&lt;/li&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;Goods market:\n\t&lt;/span&gt; &lt;/strong&gt;&lt;span class=\"auto-style8\"&gt;This graph shows the\n\tplots of the goods demand and the income curve. The latter is illustarted by\n\tthe 45\u00b0 line and corresponds to all points where income equals production in\n\tthe economy. The intersection of both lines constitutes the goods market\n\tequilibrium. To see the plots for Model 2 and 3 press the greyed fields\n\tnamed \"Model 2\" and \"Model 3\".&lt;/span&gt;&lt;/li&gt;\n\t&lt;li class=\"auto-style2\"&gt;&lt;strong&gt;&lt;span class=\"auto-style8\"&gt;Composition of GDP:\n\t&lt;/span&gt; &lt;/strong&gt;&lt;span class=\"auto-style8\"&gt;This graph\n\tshows the the composition of the GDP for all Models. Here, one can observe\n\tthe macroeconomic effects of exogenous shocks and policy measures directly.&lt;/span&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p class=\"auto-style2\"&gt;&lt;span class=\"auto-style3\"&gt;&lt;strong&gt;Model set-up:&lt;/strong&gt;&lt;/span&gt;&lt;span class=\"auto-style8\"&gt;\nThis section provides a description of all model\nequations and variables&lt;/span&gt;&lt;/p&gt;\n&lt;p class=\"auto-style2\"&gt;&lt;span class=\"auto-style3\"&gt;&lt;strong&gt;Instructions:&lt;/strong&gt;&lt;/span&gt;&lt;span class=\"auto-style8\"&gt;\nThis section provides instructions for using\nthis program&lt;/span&gt;&lt;/p&gt;\n&lt;pre class=\"auto-style7\"&gt;&amp;nbsp;&lt;span style=\"color:black\"&gt;Copyright \u00a9 2019 - Chair of Macroeconomics TU Berlin&lt;/span&gt;&lt;/pre&gt;\n&lt;pre class=\"auto-style7\"&gt;This application's code will be distributed under the open source software license GNU AGPLv3.&lt;/pre&gt;\n&lt;pre class=\"auto-style7\"&gt;&lt;span style=\"color:black\"&gt;Written by Juan Dominguez-Moran &amp;lt;&lt;a href=\"mailto:dominguezmoran@tu-berlin.de\"&gt;dominguezmoran@tu-berlin.de&lt;/a&gt;&amp;gt;, Rouven Geismar &amp;lt;&lt;a href=\"mailto:r.geismar@tu-berlin.de\"&gt;r.geismar@tu-berlin.de&lt;/a&gt;&amp;gt;&lt;o:p&gt;&lt;/o:p&gt;&lt;/span&gt;&lt;/pre&gt;\n&lt;pre class=\"auto-style7\"&gt;&lt;o:p&gt;&lt;o:p&gt;&lt;span style=\"color:black\"&gt;Version 0.9.0 (Beta)&lt;/span&gt;&lt;/o:p&gt;&lt;/o:p&gt;&lt;/pre&gt;\n&lt;pre class=\"auto-style7\"&gt;&amp;nbsp;&lt;/pre&gt;\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\n\n&lt;/body&gt;\n\n&
